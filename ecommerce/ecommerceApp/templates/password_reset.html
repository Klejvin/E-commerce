{% extends "base.html" %}
{% block title %} Reset Password {% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4 mt-5 rounded-4 text-center">
                <h2 class="fw-bold mb-4" style="color: #D4A373;">Reset Password</h2>
                <p class="text-muted small mb-4">Shkruani email-in tuaj që t'ju dërgojmë udhëzimet për fjalëkalimin e ri.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3 text-start">
                        <label class="form-label small fw-bold text-secondary">Email address</label>
                        <input type="email" name="email" class="form-control shadow-none border" placeholder="example@mail.com" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-bold shadow-sm">
                        Send Reset Link
                    </button>
                </form>

                <div class="mt-4">
                    <a href="{% url 'loginPage' %}" class="small text-decoration-none text-dark fw-bold">Kthehu te Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
