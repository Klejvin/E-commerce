{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4 mt-5 rounded-4">
                <h3 class="fw-bold mb-3 text-center">Ndrysho Fjalëkalimin</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-dark w-100 rounded-pill mt-2 py-2 fw-bold">Përditëso</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
